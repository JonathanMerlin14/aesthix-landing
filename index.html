
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AESTHIX - Inicio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    h1, h2 {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="bg-black text-white">

  <!-- Header -->
  <header class="absolute top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-4">
    <div class="text-2xl font-bold tracking-wider">AESTHIX</div>
    <a href="#pre-order" class="text-white border border-white px-5 py-2 rounded hover:bg-white hover:text-black transition">PRE-ORDER</a>
  </header>

  <!-- Hero -->
  <section class="h-screen bg-cover bg-center flex items-center justify-center relative" style="background-image: url('hero.jpg');">
    <div class="bg-black bg-opacity-60 p-8 rounded text-center max-w-2xl">
      <h1 class="text-4xl sm:text-5xl font-semibold mb-6 leading-tight">
        Awaken your power.<br>Dress with purpose.
      </h1>
      <a href="#pre-order" class="bg-white text-black px-6 py-3 font-semibold rounded hover:bg-red-600 hover:text-white transition">
        PRE-ORDER
      </a>
    </div>
  </section>

  <!-- Collections -->
  <section class="py-20 px-6 bg-zinc-900 text-center" id="collections">
    <div class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 gap-10">
      <!-- AURA -->
      <div class="hover:scale-105 transition">
        <img src="aura.jpg" alt="Aura Collection" class="rounded-lg shadow-md mb-4">
        <h2 class="text-2xl font-semibold">AURA</h2>
        <p class="text-gray-400">Women's Collection</p>
      </div>
      <!-- ATHLYON -->
      <div class="hover:scale-105 transition">
        <img src="athlyon.jpg" alt="Athlyon Collection" class="rounded-lg shadow-md mb-4">
        <h2 class="text-2xl font-semibold">ATHLYON</h2>
        <p class="text-gray-400">Men's Collection</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-black text-center py-10 border-t border-zinc-800">
    <p class="text-gray-400 italic text-lg">"Strength is the foundation of an aesthetic physique."</p>
  </footer>

</body>
</html>
